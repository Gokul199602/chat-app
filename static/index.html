<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socket Scale Test</title>
</head>
<body>

  <input id="serverInput" type="text" placeholder="Server port eg: 3000" />
  <button onclick="connectToServer()">Connect</button>

  <br><br>

  <input id="roomInput" type="text" placeholder="Room id..." />
  <button onclick="joinRoom()">Join Room</button>

  <br><br>

  <input id="msgInput" type="text" placeholder="Message..." />
  <button onclick="sendMessage()">Send</button>

  <div id="log"></div>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script>
    let socket = null;
    let currentRoom = null;
    const log = document.getElementById('log');

    function addLog(text) {
      const p = document.createElement('p');
      p.textContent = text;
      log.appendChild(p);
    }

    // Step 1: connect to a specific server port
    function connectToServer() {
      const port = document.getElementById('serverInput').value.trim();
      if (!port) return;

      // If already connected, disconnect first
      if (socket) socket.disconnect();

      socket = io('http://localhost:' + port);

      socket.on('connect', () => {
        addLog('[ connected ] server: ' + port + ' | id: ' + socket.id);
      });

      socket.on('message', ({ id, text }) => {
        addLog(id + ': ' + text);
      });

      socket.on('disconnect', () => {
        addLog('[ disconnected ]');
      });
    }

    // Step 2: join a room
    function joinRoom() {
      const roomId = document.getElementById('roomInput').value.trim();
      if (!roomId || !socket) return;
      currentRoom = roomId;
      socket.emit('join', roomId);
      addLog('[ joined room ] ' + roomId);
    }

    // Step 3: send message
    function sendMessage() {
      const text = document.getElementById('msgInput').value.trim();
      if (!text || !currentRoom || !socket) return;
      socket.emit('message', { roomId: currentRoom, text });
      document.getElementById('msgInput').value = '';
    }
  </script>

</body>
</html>
